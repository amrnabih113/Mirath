<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mirath App">

  <!-- Google Sign-In client ID for web -->
  <meta
    name="google-signin-client_id"
    content="551081167484-v7ute4pkh7nvb7v4gu8383cchvc0jd6h.apps.googleusercontent.com">

  <!-- Mobile -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mirath">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Mirath</title>

  <!-- CSP -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data:;
      connect-src 'self' https:;
    ">

  <!-- Splash Screen Style -->
  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #D5C6B4;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #D5C6B4;
      }
    }
  </style>

  <!-- Splash Screen Remove Helper -->
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>

<body>

  <!-- Splash -->
  <picture id="splash">
    <source
      srcset="
        splash/img/light-1x.png 1x,
        splash/img/light-2x.png 2x,
        splash/img/light-3x.png 3x,
        splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light)">

    <source
      srcset="
        splash/img/dark-1x.png 1x,
        splash/img/dark-2x.png 2x,
        splash/img/dark-3x.png 3x,
        splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">

    <img
      class="center"
      aria-hidden="true"
      src="splash/img/light-1x.png"
      alt="">
  </picture>

  <!-- Flutter Bootstrap -->
  <script>
    // Ensure loader prefers HTML renderer in dev and production to avoid CanvasKit CDN fetches
    try {
      window._flutter = window._flutter || {};
      window._flutter.buildConfig = window._flutter.buildConfig || {
        builds: [{ compileTarget: 'dart2js', renderer: 'html', mainJsPath: 'main.dart.js' }]
      };
    } catch (e) {
      // ignore
    }

    // Use engine initializer if available (modern API) to request HTML renderer
    try {
      if (typeof createEngineInitializer === 'function') {
        createEngineInitializer().initializeEngine({ flutterWebRenderer: 'html' });
      } else {
        // fallback for older toolchains
        window.flutterWebRenderer = 'html';
      }
    } catch (e) {
      try { window.flutterWebRenderer = 'html'; } catch (_) {}
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
